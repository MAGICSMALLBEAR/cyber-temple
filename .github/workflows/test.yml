# 每次推送與 Pull Request 自動跑輕量檢查（npm test，約 10 秒，不開 3D 瀏覽器）
# 完整測試（npm run test:full）在本機跑：GitHub 的機器跑 3D 軟體繪圖太慢，常逾時或假紅（2026-11-11 決定）
name: 測試

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 確認 libs/three.bundle.min.js 與 tools/three-entry.js 一致（忘了重新打包會在這裡失敗）
      - name: 檢查 Three.js 打包檔是最新的
        run: |
          npm ci
          npm run build:three
          git diff --exit-code libs/three.bundle.min.js

      - name: 執行輕量檢查
        run: npm test
